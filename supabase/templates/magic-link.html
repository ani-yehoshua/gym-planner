<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your sign-in code — GymPlanner</title>
</head>

<body
    style="margin:0;padding:0;background-color:#09090b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#fafafa;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                    style="max-width:480px;background-color:#18181b;border:1px solid #27272a;border-radius:20px;padding:32px;">
                    <tr>
                        <td style="padding-bottom:4px">
                            <p
                                style="margin:0;font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1;color:#fafafa;">
                                Gym<span style="color:#a1a1aa;">Planner</span>
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-bottom:24px">
                            <p
                                style="margin:0;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#71717a;">
                                Sign-in code
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-bottom:16px">
                            <h1 style="margin:0;font-size:22px;font-weight:600;line-height:1.3;color:#fafafa;">
                                Your sign-in code
                            </h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-bottom:28px">
                            <p style="margin:0;font-size:15px;line-height:1.6;color:#d4d4d8;">
                                Enter this code on the sign-in page. It expires in 15 minutes.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-bottom:28px">
                            <p
                                style="margin:0;font-size:32px;font-weight:700;letter-spacing:0.3em;color:#fafafa;background-color:#27272a;border:1px solid #3f3f46;border-radius:12px;padding:20px 28px;display:inline-block;">
                                {{ .Token }}
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="border-top:1px solid #27272a;padding-top:16px">
                            <p style="margin:0;font-size:12px;line-height:1.5;color:#71717a;">
                                If you didn't request this code, you can safely ignore this email.
                            </p>
                        </td>
                    </tr>
                </table>
                <p style="margin:16px 0 0;font-size:12px;color:#71717a;">© 2026 GymPlanner</p>
            </td>
        </tr>
    </table>
</body>

</html>
